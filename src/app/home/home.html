<!-- 
    - Single page application with a few sections, including a hero section, a carousel of recent work, and a projects section. The hero section introduces the individual and their interests. 
    - The carousel showcases recent website work with images and captions. 
    - The projects section is included at the end of the home page. 
-->

<section class="hero" #hero aria-label="Introduction">                
    <div class="hero-copy">                                    
        <p class="hero-eyebrow">// Available for new projects this quarter</p>
        <h1>Hi, I'm Asad. I like building products that feel as good as they work.</h1>
        <p>I enjoy working across different areas of technology and finding practical solutions to technical challenges.</p>
    </div>

    <div class="carousel" id="carousel" role="group" aria-roledescription="carousel" aria-label="Recent website work" 
        (mouseenter)="stop()" (mouseleave)="start()"
        (focusin)="stop()" (focusout)="start()"
        (keydown)="onCarouselKey($event)"
        >
        <div class="carousel-viewport">
            <div class="carousel-track" id="carouselTrack" #track
                (pointerdown)="onTrackPointerDown($event)"
                (pointerup)="onTrackPointerUp($event)"
                (pointercancel)="touchX = null"
            >
                <figure class="slide" role="group" aria-roledescription="slide" aria-label="1 of 3">
                    <img src="./assets/images/carousel/website1.png" width="750" height="389" alt="Violet website: a dark page headed &ldquo;I build for the web and keep one eye on the sky.&rdquo;">
                    <figcaption>Cybersecurity, cloud and AI projects, plus a small shop</figcaption>
                </figure>
                <figure class="slide" role="group" aria-roledescription="slide" aria-label="2 of 3">
                    <img src="./assets/images/carousel/website2.png" width="750" height="386" alt="A website: a light page with a storefront, a portfolio and an about section">
                    <figcaption>A website: a storefront, a portfolio and the person behind them</figcaption>
                </figure>
            </div>
        </div>
        <div class="carousel-controls">
            <button type="button" class="carousel-btn" id="carouselPrev" aria-label="Previous slide" (click)="goTo(current - 1)">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="carousel-dots" id="carouselDots">
                @for (n of dots; track n) {
                <button type="button" class="carousel-dot"
                        [attr.aria-label]="'Go to slide ' + (n + 1)"
                        [attr.aria-current]="n === current ? 'true' : null"
                        (click)="goTo(n)"></button>
                }
            </div>
            <button type="button" class="carousel-btn" id="carouselNext" aria-label="Next slide" (click)="goTo(current + 1)">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" class="carousel-toggle" id="carouselToggle" [attr.aria-label]="userPaused ? 'Start automatic slide changes' : 'Pause automatic slide changes'"
    (click)="toggleAuto()">{{ userPaused ? 'Play' : 'Pause' }}</button>
        </div>
    </div>
</section>


<app-projects />


<app-notes />
